<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 150" width="860" height="150" role="img" aria-label="key: sun is me, planets are repos sized by code and coloured by language, newer repos orbit closer, rings mean published, moons are sub-projects and merged PRs, comets were pushed today, the probe is a daily bot"><title>key: sun is me, planets are repos sized by code and coloured by language, newer repos orbit closer, rings mean published, moons are sub-projects and merged PRs, comets were pushed today, the probe is a daily bot</title><style>@media (prefers-reduced-motion:reduce){*{animation:none!important}.l,.c{opacity:1!important}}</style><rect x=".5" y=".5" width="859" height="149" fill="#f7f0df" stroke="#3a2e22" stroke-opacity=".55"/><g transform="translate(36,36)"><circle r="9" fill="#d8b46a" stroke="#3a2e22"/></g><text x="60.0" y="33.0" font-family='Georgia,"Times New Roman",serif' font-size="13" font-weight="700" fill="#3a2e22" text-anchor="start" font-style="italic">the sun</text><text x="60.0" y="49.0" font-family='"Courier New",Courier,monospace' font-size="11" font-weight="400" fill="#76664f" text-anchor="start">me</text><g transform="translate(244,36)"><circle r="7" fill="#7d97b8" stroke="#3a2e22"/></g><text x="268.0" y="33.0" font-family='Georgia,"Times New Roman",serif' font-size="13" font-weight="700" fill="#3a2e22" text-anchor="start" font-style="italic">a planet</text><text x="268.0" y="49.0" font-family='"Courier New",Courier,monospace' font-size="11" font-weight="400" fill="#76664f" text-anchor="start">a public repo, sized by code</text><g transform="translate(452,36)"><circle cx="-8" r="3.6" fill="#7d97b8"/><circle cx="0" r="3.6" fill="#cfae5c"/><circle cx="8" r="3.6" fill="#6fa59c"/></g><text x="476.0" y="33.0" font-family='Georgia,"Times New Roman",serif' font-size="13" font-weight="700" fill="#3a2e22" text-anchor="start" font-style="italic">colour</text><text x="476.0" y="49.0" font-family='"Courier New",Courier,monospace' font-size="1